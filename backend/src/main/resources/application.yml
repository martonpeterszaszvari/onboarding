server:
  port: 8080
spring:
  application:
    name: onboarding-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onboarding}
    username: ${DB_USER:onboarding}
    password: ${DB_PASSWORD:onboarding}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
hunter:
  mode: ${HUNTER_MODE:mock}
  api-key: ${HUNTER_API_KEY:}
  fast-timeout-ms: ${HUNTER_FAST_TIMEOUT_MS:2000}
app:
  worker:
    tick-ms: ${WORKER_TICK_MS:1000}
    lease-seconds: 60
    pending-delay-seconds: ${PENDING_DELAY_SECONDS:4}
    retry-base-seconds: ${RETRY_BASE_SECONDS:2}
    max-attempts: 5
